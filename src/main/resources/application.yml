server:
  port: ${SERVER_PORT:8080}

curso:
  nome-app: Sistema de Chamados
  mensagem: Ambiente padrão

spring:
  datasource:
    # Segredos NUNCA versionados: vêm do ambiente.
    # O valor após ":" é apenas o padrão de desenvolvimento local.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/chamados}
    username: ${DB_USER:curso}
    password: ${DB_PASSWORD:curso}
  jpa:
    hibernate:
      ddl-auto: validate   # o Hibernate confere; quem cria e evolui é o Flyway
    show-sql: ${SHOW_SQL:true}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/curso-realm}

integracao:
  viacep:
    base-url: ${VIACEP_BASE_URL:https://viacep.com.br}
